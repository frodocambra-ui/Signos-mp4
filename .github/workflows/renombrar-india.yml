name: Renombrar videos India con palabra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renombrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install webdataset

      - name: Descargar metadatos y renombrar
        run: |
          python - <<'PY'
          import webdataset as wds
          import json
          import re
          import shutil
          from pathlib import Path

          dest = Path("videos/india")
          urls = [
              f"https://huggingface.co/datasets/bridgeconn/sign-dictionary-isl/resolve/main/shard_{i:05d}-train.tar"
              for i in range(1, 8)
          ]

          def slug(text):
              text = str(text).lower().strip()
              text = re.sub(r'[^a-z0-9\u0900-\u097F]+', '-', text)  # keep Devanagari too
              text = re.sub(r'-+', '-', text).strip('-')
              return text[:80] or "sign"

          # map key -> word
          key_to_word = {}
          dataset = wds.WebDataset(urls, shardshuffle=False)
          for sample in dataset:
              try:
                  key = sample.get("__key__", "")
                  js = sample.get("json")
                  if isinstance(js, bytes):
                      js = json.loads(js.decode("utf-8"))
                  elif isinstance(js, str):
                      js = json.loads(js)
                  word = None
                  if isinstance(js, dict):
                      # try several fields
                      for field in ("glosses", "transcripts", "filename", "gloss", "word", "label"):
                          val = js.get(field)
                          if val:
                              if isinstance(val, list) and val:
                                  word = str(val[0])
                              else:
                                  word = str(val)
                              break
                  if word and key:
                      key_to_word[key] = slug(word)
              except Exception:
                  continue

          print(f"Mapeos encontrados: {len(key_to_word)}")
          # sample
          items = list(key_to_word.items())[:10]
          for k, w in items:
              print(f"  {k} -> {w}")

          # rename existing numbered files
          renamed = 0
          seen = set()
          for mp4 in sorted(dest.glob("*.mp4")):
              stem = mp4.stem
              # if stem looks like a number/key, try to map
              word = key_to_word.get(stem)
              if not word:
                  # also try without leading zeros etc
                  word = key_to_word.get(stem.lstrip("0") or "0")
              if word:
                  final = word
                  i = 1
                  while final in seen or (dest / f"{final}.mp4").exists():
                      final = f"{word}-{i}"
                      i += 1
                  seen.add(final)
                  new_path = dest / f"{final}.mp4"
                  if new_path != mp4:
                      mp4.rename(new_path)
                      renamed += 1
          print(f"Renombrados: {renamed}")
          PY

      - name: Subir renombrados por lotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd videos/india
          # remove old numbered if any left, then add all
          git add -A
          if git diff --cached --quiet; then
            echo "Nada que renombrar"
          else
            git commit -m "Renombra vídeos ISL con la palabra"
            # push in chunks if needed
            git push || git push || true
          fi
