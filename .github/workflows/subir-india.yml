name: Subir videos India (ISL) desde Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install webdataset requests

      - name: Descargar, extraer y renombrar vídeos ISL
        run: |
          mkdir -p videos/india
          python - <<'PY'
          import webdataset as wds
          import json
          import re
          from pathlib import Path

          dest = Path("videos/india")
          dest.mkdir(parents=True, exist_ok=True)

          urls = [
              f"https://huggingface.co/datasets/bridgeconn/sign-dictionary-isl/resolve/main/shard_{i:05d}-train.tar"
              for i in range(1, 8)
          ]

          def slug(text):
              text = text.lower().strip()
              text = re.sub(r'[^a-z0-9]+', '-', text)
              text = re.sub(r'-+', '-', text).strip('-')
              return text or "sign"

          count = 0
          seen = set()
          dataset = wds.WebDataset(urls, shardshuffle=False).decode()
          for sample in dataset:
              try:
                  js = sample.get("json")
                  if isinstance(js, bytes):
                      js = json.loads(js.decode("utf-8"))
                  elif isinstance(js, str):
                      js = json.loads(js)
                  name = None
                  if isinstance(js, dict):
                      if js.get("glosses"):
                          name = js["glosses"][0] if isinstance(js["glosses"], list) else str(js["glosses"])
                      elif js.get("transcripts"):
                          name = js["transcripts"][0] if isinstance(js["transcripts"], list) else str(js["transcripts"])
                      elif js.get("filename"):
                          name = js["filename"]
                  if not name:
                      name = sample.get("__key__", f"sign-{count}")
                  base = slug(str(name))
                  # avoid collisions
                  final = base
                  i = 1
                  while final in seen:
                      final = f"{base}-{i}"
                      i += 1
                  seen.add(final)
                  mp4 = sample.get("mp4")
                  if mp4 is None:
                      continue
                  out = dest / f"{final}.mp4"
                  if isinstance(mp4, bytes):
                      out.write_bytes(mp4)
                  else:
                      # already decoded path or similar
                      continue
                  count += 1
                  if count % 200 == 0:
                      print(f"Procesados {count}")
              except Exception as e:
                  print("skip", e)
                  continue
          print(f"Total vídeos guardados: {count}")
          PY

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/india/
          if git diff --cached --quiet; then
            echo "Nada nuevo"
          else
            git commit -m "Añade vídeos de lengua de signos india (ISL) desde Hugging Face"
            git push
          fi
